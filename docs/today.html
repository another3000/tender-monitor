<body data-page="today" data-root="data">
  <header class="site-nav">
    <div class="container inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">标</span>
        <span>招投标信息监控</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="菜单">菜单</button>
      <ul class="nav-links">

        <h2>2026-10-30</h2>

      <div class="toolbar">
        <input id="filter-q" type="search" placeholder="搜索标题、采购人、地区…" />

          <button type="button" class="chip" data-tag="输血">输血</button>
          <button type="button" class="chip" data-tag="LIMS">LIMS</button>
        </div>
      </div>
      <div id="tender-list" class="card-list" data-source="data/tenders/2026-10-30.json" data-detail-prefix=""></div>

  <footer class="site-footer">
